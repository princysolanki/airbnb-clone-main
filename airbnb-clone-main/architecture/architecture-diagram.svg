<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" font-family="Inter, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6472" />
    </marker>
    <marker id="arrow-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa3b2" />
    </marker>
  </defs>

  <rect width="1600" height="1180" fill="#f7f8fa" />

  <text x="40" y="46" font-size="26" font-weight="700" fill="#1a1d24">Vacation-Rental Marketplace — Production Architecture</text>
  <text x="40" y="70" font-size="14" fill="#5b6472">Scaling strategy: frontend, backend, storage, search, and deployment</text>

  <!-- ===== Layer band labels ===== -->
  <g font-size="12" font-weight="700" fill="#9aa3b2" letter-spacing="1">
    <text x="40" y="112">CLIENTS</text>
    <text x="40" y="212">EDGE / CDN</text>
    <text x="40" y="322">API &amp; AUTH</text>
    <text x="40" y="384">APPLICATION SERVICES (containerized, independently scaled)</text>
    <text x="40" y="672">ASYNC / EVENTING</text>
    <text x="40" y="716">DATA &amp; STORAGE</text>
    <text x="40" y="906">PLATFORM &amp; OBSERVABILITY</text>
    <text x="40" y="1016">CI/CD &amp; INFRASTRUCTURE</text>
  </g>

  <!-- ===== Row 1: Clients ===== -->
  <g>
    <rect x="480" y="86" width="220" height="60" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="590" y="112" font-size="14" font-weight="600" text-anchor="middle" fill="#312e81">Web App</text>
    <text x="590" y="131" font-size="11" text-anchor="middle" fill="#4338ca">Next.js (React) SPA/SSR</text>

    <rect x="740" y="86" width="220" height="60" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="850" y="112" font-size="14" font-weight="600" text-anchor="middle" fill="#312e81">Mobile Apps</text>
    <text x="850" y="131" font-size="11" text-anchor="middle" fill="#4338ca">iOS / Android (React Native)</text>

    <rect x="1000" y="86" width="220" height="60" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="1110" y="112" font-size="14" font-weight="600" text-anchor="middle" fill="#312e81">Partner APIs</text>
    <text x="1110" y="131" font-size="11" text-anchor="middle" fill="#4338ca">Channel managers, OTAs</text>
  </g>

  <!-- ===== Row 2: Edge / CDN ===== -->
  <g>
    <rect x="440" y="186" width="340" height="70" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
    <text x="610" y="214" font-size="14" font-weight="600" text-anchor="middle" fill="#581c87">Global CDN</text>
    <text x="610" y="233" font-size="11" text-anchor="middle" fill="#6b21a8">Static assets, image optimization &amp; resizing, TLS termination</text>

    <rect x="820" y="186" width="340" height="70" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
    <text x="990" y="207" font-size="14" font-weight="600" text-anchor="middle" fill="#581c87">Edge Network (Vercel)</text>
    <text x="990" y="225" font-size="11" text-anchor="middle" fill="#6b21a8">Next.js SSR + ISR at the edge</text>
    <text x="990" y="241" font-size="11" text-anchor="middle" fill="#6b21a8">per-region cache of listing pages</text>
  </g>

  <!-- ===== Row 3: API Gateway / Auth ===== -->
  <g>
    <rect x="480" y="296" width="260" height="66" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="610" y="322" font-size="14" font-weight="600" text-anchor="middle" fill="#0c4a6e">API Gateway / BFF</text>
    <text x="610" y="340" font-size="11" text-anchor="middle" fill="#075985">GraphQL/REST, rate limiting</text>

    <rect x="760" y="296" width="260" height="66" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="890" y="322" font-size="14" font-weight="600" text-anchor="middle" fill="#0c4a6e">Auth Service</text>
    <text x="890" y="340" font-size="11" text-anchor="middle" fill="#075985">OAuth2 / JWT, session &amp; identity</text>
  </g>

  <!-- ===== Row 4: Microservices ===== -->
  <g>
    <!-- 6 service boxes across two rows of 3 -->
    <g id="svc1">
      <rect x="60" y="406" width="230" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <text x="175" y="432" font-size="13" font-weight="600" text-anchor="middle" fill="#14532d">Listings Service</text>
      <text x="175" y="450" font-size="10.5" text-anchor="middle" fill="#166534">CRUD, availability, media refs</text>
    </g>
    <g>
      <rect x="310" y="406" width="230" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <text x="425" y="432" font-size="13" font-weight="600" text-anchor="middle" fill="#14532d">Search Service</text>
      <text x="425" y="450" font-size="10.5" text-anchor="middle" fill="#166534">Query, ranking, geo filters</text>
    </g>
    <g>
      <rect x="560" y="406" width="230" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <text x="675" y="432" font-size="13" font-weight="600" text-anchor="middle" fill="#14532d">Pricing &amp; Availability</text>
      <text x="675" y="450" font-size="10.5" text-anchor="middle" fill="#166534">Dynamic pricing, calendars</text>
    </g>
    <g>
      <rect x="810" y="406" width="230" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <text x="925" y="432" font-size="13" font-weight="600" text-anchor="middle" fill="#14532d">Booking Service</text>
      <text x="925" y="450" font-size="10.5" text-anchor="middle" fill="#166534">Reservation state machine</text>
    </g>
    <g>
      <rect x="1060" y="406" width="230" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <text x="1175" y="432" font-size="13" font-weight="600" text-anchor="middle" fill="#14532d">Payments Service</text>
      <text x="1175" y="450" font-size="10.5" text-anchor="middle" fill="#166534">PSP integration, payouts, ledger</text>
    </g>
    <g>
      <rect x="1310" y="406" width="230" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <text x="1425" y="432" font-size="13" font-weight="600" text-anchor="middle" fill="#14532d">Reviews Service</text>
      <text x="1425" y="450" font-size="10.5" text-anchor="middle" fill="#166534">Ratings, moderation</text>
    </g>

    <rect x="60" y="490" width="230" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="175" y="516" font-size="13" font-weight="600" text-anchor="middle" fill="#14532d">User / Host Service</text>
    <text x="175" y="534" font-size="10.5" text-anchor="middle" fill="#166534">Profiles, verification, KYC</text>

    <rect x="310" y="490" width="230" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="425" y="516" font-size="13" font-weight="600" text-anchor="middle" fill="#14532d">Messaging Service</text>
    <text x="425" y="534" font-size="10.5" text-anchor="middle" fill="#166534">Guest ↔ host chat, notifications</text>

    <rect x="560" y="490" width="230" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="675" y="516" font-size="13" font-weight="600" text-anchor="middle" fill="#14532d">Media Service</text>
    <text x="675" y="534" font-size="10.5" text-anchor="middle" fill="#166534">Upload, transcode, moderation</text>

    <rect x="810" y="490" width="230" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="925" y="516" font-size="13" font-weight="600" text-anchor="middle" fill="#14532d">Trust &amp; Safety</text>
    <text x="925" y="534" font-size="10.5" text-anchor="middle" fill="#166534">Fraud detection, risk scoring</text>

    <rect x="1060" y="490" width="230" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="1175" y="516" font-size="13" font-weight="600" text-anchor="middle" fill="#14532d">Notification Service</text>
    <text x="1175" y="534" font-size="10.5" text-anchor="middle" fill="#166534">Email / SMS / push fan-out</text>

    <rect x="1310" y="490" width="230" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="1425" y="516" font-size="13" font-weight="600" text-anchor="middle" fill="#14532d">Analytics Service</text>
    <text x="1425" y="534" font-size="10.5" text-anchor="middle" fill="#166534">Pricing signals, BI export</text>

    <rect x="40" y="396" width="1520" height="176" rx="14" fill="none" stroke="#86efac" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="1540" y="390" font-size="10.5" text-anchor="end" fill="#16a34a">each service: stateless, horizontally auto-scaled, own datastore</text>
  </g>

  <!-- ===== Row 5: Async / Eventing ===== -->
  <g>
    <rect x="480" y="616" width="640" height="60" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="800" y="642" font-size="14" font-weight="600" text-anchor="middle" fill="#713f12">Event Bus — Kafka / SQS+SNS</text>
    <text x="800" y="660" font-size="11" text-anchor="middle" fill="#854d0e">booking.created, price.updated, review.posted, payout.settled …</text>
  </g>

  <!-- ===== Row 6: Data & storage ===== -->
  <g>
    <rect x="60" y="726" width="260" height="72" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
    <text x="190" y="752" font-size="13" font-weight="600" text-anchor="middle" fill="#7c2d12">PostgreSQL (per domain)</text>
    <text x="190" y="769" font-size="10.5" text-anchor="middle" fill="#9a3412">Sharded, primary + read replicas</text>
    <text x="190" y="784" font-size="10.5" text-anchor="middle" fill="#9a3412">(listings, bookings, payments)</text>

    <rect x="350" y="726" width="230" height="72" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
    <text x="465" y="752" font-size="13" font-weight="600" text-anchor="middle" fill="#7c2d12">Redis Cluster</text>
    <text x="465" y="769" font-size="10.5" text-anchor="middle" fill="#9a3412">Cache, sessions, rate limits</text>
    <text x="465" y="784" font-size="10.5" text-anchor="middle" fill="#9a3412">availability hot-set</text>

    <rect x="610" y="726" width="230" height="72" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
    <text x="725" y="752" font-size="13" font-weight="600" text-anchor="middle" fill="#7c2d12">OpenSearch</text>
    <text x="725" y="769" font-size="10.5" text-anchor="middle" fill="#9a3412">Listing search index,</text>
    <text x="725" y="784" font-size="10.5" text-anchor="middle" fill="#9a3412">geo + facet queries</text>

    <rect x="870" y="726" width="230" height="72" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
    <text x="985" y="752" font-size="13" font-weight="600" text-anchor="middle" fill="#7c2d12">Object Storage + CDN</text>
    <text x="985" y="769" font-size="10.5" text-anchor="middle" fill="#9a3412">S3 (photos, docs) fronted by</text>
    <text x="985" y="784" font-size="10.5" text-anchor="middle" fill="#9a3412">image-resizing CDN</text>

    <rect x="1130" y="726" width="230" height="72" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
    <text x="1245" y="752" font-size="13" font-weight="600" text-anchor="middle" fill="#7c2d12">Data Warehouse</text>
    <text x="1245" y="769" font-size="10.5" text-anchor="middle" fill="#9a3412">Snowflake/BigQuery via CDC</text>
    <text x="1245" y="784" font-size="10.5" text-anchor="middle" fill="#9a3412">from event bus</text>

    <rect x="1390" y="726" width="150" height="72" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
    <text x="1465" y="752" font-size="13" font-weight="600" text-anchor="middle" fill="#7c2d12">Blob Cache</text>
    <text x="1465" y="769" font-size="10.5" text-anchor="middle" fill="#9a3412">CDN edge cache</text>
    <text x="1465" y="784" font-size="10.5" text-anchor="middle" fill="#9a3412">for media</text>
  </g>

  <!-- ===== Row 7: Platform & Observability ===== -->
  <g>
    <rect x="60" y="916" width="340" height="60" rx="10" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/>
    <text x="230" y="942" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">Observability</text>
    <text x="230" y="960" font-size="10.5" text-anchor="middle" fill="#374151">Metrics/Tracing (Prometheus, Grafana, OTel), Sentry</text>

    <rect x="420" y="916" width="340" height="60" rx="10" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/>
    <text x="590" y="942" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">Service Mesh / Discovery</text>
    <text x="590" y="960" font-size="10.5" text-anchor="middle" fill="#374151">mTLS, retries, circuit breaking</text>

    <rect x="780" y="916" width="340" height="60" rx="10" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/>
    <text x="950" y="942" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">Feature Flags / Experiments</text>
    <text x="950" y="960" font-size="10.5" text-anchor="middle" fill="#374151">Gradual rollout, A/B testing</text>

    <rect x="1140" y="916" width="400" height="60" rx="10" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/>
    <text x="1340" y="942" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">Secrets &amp; Config</text>
    <text x="1340" y="960" font-size="10.5" text-anchor="middle" fill="#374151">Vault / KMS, per-environment config</text>
  </g>

  <!-- ===== Row 8: CI/CD & Infra ===== -->
  <g>
    <rect x="60" y="1026" width="330" height="66" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="225" y="1052" font-size="13" font-weight="600" text-anchor="middle" fill="#1e3a8a">CI (GitHub Actions)</text>
    <text x="225" y="1070" font-size="10.5" text-anchor="middle" fill="#1e40af">Test, build, container scan</text>

    <rect x="410" y="1026" width="330" height="66" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="575" y="1052" font-size="13" font-weight="600" text-anchor="middle" fill="#1e3a8a">CD — Frontend → Vercel</text>
    <text x="575" y="1070" font-size="10.5" text-anchor="middle" fill="#1e40af">Preview deploys, instant rollback</text>

    <rect x="760" y="1026" width="330" height="66" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="925" y="1052" font-size="13" font-weight="600" text-anchor="middle" fill="#1e3a8a">CD — Services → Kubernetes</text>
    <text x="925" y="1070" font-size="10.5" text-anchor="middle" fill="#1e40af">Multi-region, blue/green, HPA</text>

    <rect x="1110" y="1026" width="430" height="66" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="1325" y="1052" font-size="13" font-weight="600" text-anchor="middle" fill="#1e3a8a">Infrastructure as Code</text>
    <text x="1325" y="1070" font-size="10.5" text-anchor="middle" fill="#1e40af">Terraform — multi-region VPCs, DB clusters, CDN config</text>
  </g>

  <!-- ===== Connector arrows (major flow) ===== -->
  <g stroke="#5b6472" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M600,146 L610,186" />
    <path d="M850,146 L900,186" />
    <path d="M610,256 L610,296" />
    <path d="M990,256 L890,296" />
    <path d="M610,362 L610,392" />
    <path d="M890,362 L890,392" />
  </g>
  <g stroke="#9aa3b2" stroke-width="1.4" fill="none" marker-end="url(#arrow-light)">
    <path d="M800,568 L800,616" />
    <path d="M300,568 L300,676 L190,676 L190,726" />
    <path d="M600,568 L600,676 L465,676 L465,726" />
    <path d="M850,568 L850,676 L725,676 L725,726" />
    <path d="M1100,568 L1100,676 L985,676 L985,726" />
    <path d="M1300,568 L1300,676 L1245,676 L1245,726" />
  </g>

  <!-- ===== Legend ===== -->
  <g font-size="11" fill="#374151">
    <rect x="1250" y="86" width="14" height="14" rx="3" fill="#eef2ff" stroke="#6366f1"/>
    <text x="1270" y="98">Client</text>
    <rect x="1330" y="86" width="14" height="14" rx="3" fill="#f3e8ff" stroke="#a855f7"/>
    <text x="1350" y="98">Edge</text>
  </g>

  <text x="40" y="1150" font-size="11" fill="#8b93a3">
    Notes: independent scaling per service behind the gateway; read-heavy listing/search paths cached at edge + Redis; async event bus decouples booking, payments, notifications, and analytics.
  </text>
</svg>
